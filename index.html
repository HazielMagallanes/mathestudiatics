<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Plataforma bilingüe para estudiar matemática: teoría, ejercicios generados al azar, pizarra y calculadora. / Bilingual platform to study math: theory, randomly generated exercises, whiteboard and calculator."
    />
    <meta name="theme-color" content="#1e2a44" />
    <title>Mathestudiatics</title>
    <script>
      /* Applies the stored theme before first paint to avoid a light/dark flash.
         The build injects its CSP hash automatically (see vite.config.ts). */
      ;(function () {
        try {
          var stored = localStorage.getItem('mathestudiatics.theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch {
          /* preferences are best-effort */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
